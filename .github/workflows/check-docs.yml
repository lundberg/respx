name: check-docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yaml'
      - 'noxfile.py'
      - 'setup.py'
      - 'respx/__init__.py'
      - 'respx/router.py'
      - 'scripts/check_docs_inventory.py'
      - '.github/workflows/check-docs.yml'

jobs:
  check-docs:
    name: Check Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install nox
      - name: Build
        run: nox -N -s docs_test
